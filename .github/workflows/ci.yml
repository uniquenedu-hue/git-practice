name: My First CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run Python application
        run: python3 hello.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Use test secret
        run: echo "The secret exists and has been provided to this job"
        env:
          MY_TEST_SECRET: ${{ secrets.MY_TEST_SECRET }}

      - name: Show environment
        run: echo "Running in $APP_ENV"
        env:
          APP_ENV: ${{ vars.APP_ENV }}

      - name: Show files
        run: ls -la

      - name: Main branch message
        if: github.ref == 'refs/heads/main'
        run: echo "This is the main branch"

      - name: Show event type
        run: echo "Workflow triggered by ${{ github.event_name }}"

      - name: Pull request message
        if: github.event_name == 'pull_request'
        run: echo "This workflow was triggered by a pull request"

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Build application
        run: echo "Building application..."
