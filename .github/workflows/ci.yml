name: My First CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run Python application
        run: python3 hello.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Use test secret
        run: echo "The secret exists and has been provided to this job"
        env:
          MY_TEST_SECRET: ${{ secrets.MY_TEST_SECRET }}

      - name: Show files
        run: ls -la
